name: Harness Check
on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'docs/**'
      - '.harness/**'
      - 'harness.config.yaml'
      - '.github/workflows/harness-check.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build pinned harness CLI
        env:
          HARNESS_REVISION: 0e0ee8dd87f86bcaa38335f862ab08da46ad9e77
        run: |
          git clone --no-checkout https://github.com/StvnWthrsp/harness.git "$RUNNER_TEMP/harness"
          git -C "$RUNNER_TEMP/harness" checkout --detach "$HARNESS_REVISION"
          npm ci --prefix "$RUNNER_TEMP/harness"
          npm run build --prefix "$RUNNER_TEMP/harness"
      - run: node "$RUNNER_TEMP/harness/dist/index.js" check
