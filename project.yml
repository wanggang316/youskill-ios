name: YouSkill

options:
  minimumXcodeGenVersion: 2.45.0
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  groupSortPosition: top
  createIntermediateGroups: true

packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: 2.4.1
  HighlightSwift:
    url: https://github.com/appstefan/highlightswift.git
    from: 1.1.0

settings:
  base:
    PRODUCT_NAME: YouSkill
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    SWIFT_VERSION: 6.0
    GENERATE_INFOPLIST_FILE: NO
    SUPPORTS_MACCATALYST: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

targets:
  YouSkill:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    dependencies:
      - package: MarkdownUI
      - package: HighlightSwift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gumpw.youskill
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: HC438T2B8P
        CODE_SIGN_IDENTITY[sdk=iphoneos*]: Apple Development
        TARGETED_DEVICE_FAMILY: "1"
    sources:
      - path: Sources
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: YouSkill
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UIUserInterfaceStyle: Light
        UILaunchStoryboardName:
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    scheme:
      testTargets:
        - YouSkillTests

  YouSkillTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gumpw.youskill.tests
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
    sources:
      - path: Tests
    dependencies:
      - target: YouSkill
    info:
      path: Tests/Info.plist
      properties:
        CFBundleDisplayName: YouSkillTests
        UILaunchScreen: {}
